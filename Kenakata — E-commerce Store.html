<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenakata — Online Shopping in Bangladesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f8;--card:#ffffff;--ink:#151829;--mute:#5b6178;--line:#e2e5ee;
  --brand:#2a2a86;--brand-2:#3d3dbd;--on-brand:#ffffff;--head:#2a2a86;
  --accent:#ffb400;--on-accent:#251b00;--sale:#d9223f;--ok:#0d8659;--soft:#ecebfa;
  --shadow:0 1px 2px rgba(20,20,60,.06),0 6px 20px rgba(20,20,60,.06);
  --r:12px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1020;--card:#171a31;--ink:#eceefb;--mute:#9aa1bf;--line:#2a2e4e;
  --brand:#6465e8;--brand-2:#7b7cf0;--head:#181b38;--soft:#23264a;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0e1020;--card:#171a31;--ink:#eceefb;--mute:#9aa1bf;--line:#2a2e4e;
  --brand:#6465e8;--brand-2:#7b7cf0;--head:#181b38;--soft:#23264a;--shadow:0 1px 2px rgba(0,0,0,.4);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}
.wrap{width:100%;max-width:1260px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 18px;font-weight:600;background:var(--brand);color:var(--on-brand);transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.alt{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px;color:var(--mute)}
.field{margin-bottom:12px}
.row{display:flex;gap:12px}
.row>*{flex:1}
/* header */
.top{background:var(--head);color:#fff;font-size:13px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;min-height:34px;gap:12px}
.top a,.top button{color:#fff;background:none;border:0;padding:4px 6px;font-size:13px}
.top .l,.top .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header.main{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--head);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15)}
header.main .bar{display:flex;align-items:center;gap:16px;padding:10px 0}
.logo{font-weight:700;font-size:26px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-style:normal;font-size:20px}
.searchbox{position:relative;flex:1;max-width:680px}
.searchbox form{display:flex}
.searchbox input{border:0;border-radius:10px 0 0 10px;color:#151829;background:#fff;padding:11px 14px}
.searchbox button{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;padding:0 20px;border-radius:0 10px 10px 0}
#sug{position:absolute;left:0;right:0;top:100%;background:var(--card);color:var(--ink);border-radius:0 0 12px 12px;box-shadow:var(--shadow);overflow:hidden;display:none;z-index:50}
#sug a{display:flex;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
#sug a:hover,#sug a:focus{background:var(--soft)}
.icons{display:flex;gap:6px;align-items:center;margin-left:auto}
.ib{position:relative;display:flex;flex-direction:column;align-items:center;color:#fff;background:none;border:0;padding:4px 10px;font-size:12px;border-radius:10px}
.ib:hover{background:rgba(255,255,255,.12)}
.ib .ico{font-size:22px;line-height:1}
.ib .cnt{position:absolute;top:-2px;right:2px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.catnav{background:var(--card);border-bottom:1px solid var(--line)}
.catnav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-top:6px;padding-bottom:6px}
.catnav a{white-space:nowrap;padding:6px 12px;border-radius:20px;font-size:14px;font-weight:500;color:var(--mute)}
.catnav a:hover,.catnav a.on{background:var(--soft);color:var(--ink)}
/* hero */
.hero{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin:16px 0}
.slides{position:relative;border-radius:var(--r);overflow:hidden;min-height:300px;box-shadow:var(--shadow)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:34px 48px;color:#fff;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
.slide.on{opacity:1;visibility:visible}
.slide h2{font-size:clamp(28px,4.4vw,52px);line-height:1.05;margin:0 0 10px;font-weight:700;letter-spacing:-1px;max-width:14ch}
.slide p{margin:0 0 20px;max-width:38ch;opacity:.92;font-size:16px}
.slide .big{position:absolute;right:28px;bottom:-30px;font-size:210px;line-height:1;opacity:.95;filter:drop-shadow(0 12px 20px rgba(0,0,0,.25));pointer-events:none}
.sn{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#111;font-size:18px;z-index:2}
.sn.p{left:10px}.sn.n{right:10px}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;z-index:2}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.5)}
.dots button.on{background:#fff;width:24px;border-radius:6px}
.promos{display:grid;gap:14px;grid-template-rows:1fr 1fr}
.promo{border-radius:var(--r);padding:20px;color:#fff;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.promo b{font-size:22px;line-height:1.1;max-width:12ch}
.promo span{font-size:13px;opacity:.9;margin-top:4px}
.promo em{position:absolute;right:12px;bottom:-8px;font-size:84px;font-style:normal}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.trust div{background:var(--card);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.trust .ic{font-size:26px}
.trust b{display:block;font-size:14px}.trust small{color:var(--mute)}
/* sections */
.sec{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:22px;box-shadow:var(--shadow)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sh h2{margin:0;font-size:21px;letter-spacing:-.3px}
.flash{background:linear-gradient(100deg,#d9223f,#ff6a3d);color:#fff}
.flash .sh h2{color:#fff}
.cd{display:flex;gap:4px;align-items:center;font-weight:700}
.cd i{font-style:normal;background:#151829;color:#fff;border-radius:6px;padding:2px 8px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.hrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,190px);gap:12px;overflow-x:auto;padding-bottom:6px}
.cats{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:var(--r);text-align:center;font-size:13.5px;font-weight:600;background:var(--soft);transition:transform .15s}
.cat:hover{transform:translateY(-3px)}
.cat .ci{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:hsl(var(--h) 80% 90%)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;color:var(--ink)}
.card:hover{box-shadow:var(--shadow)}
.ph{position:relative;display:grid;place-items:center;aspect-ratio:1/1;background:linear-gradient(145deg,hsl(var(--h) 85% 93%),hsl(var(--h) 75% 84%))}
.ph .em{font-size:76px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.badge{position:absolute;top:8px;left:8px;background:var(--sale);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#9aa0b5;font-size:18px;display:grid;place-items:center}
.heart.on{color:var(--sale)}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.nm{font-size:14px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.pr{display:flex;gap:8px;align-items:baseline}
.pr b{font-size:18px;color:var(--brand)}
.pr s{color:var(--mute);font-size:13px}
.meta{font-size:12px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.low{color:var(--sale);font-weight:600}
.stars{color:#f5a300;letter-spacing:1px}
.card .add{margin-top:auto}
/* shop */
.crumb{font-size:13px;color:var(--mute);margin:14px 0}
.shop{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.side{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
.side h3{margin:12px 0 8px;font-size:14px}
.side h3:first-child{margin-top:0}
.side a{display:block;padding:5px 8px;border-radius:8px;font-size:14px}
.side a.on,.side a:hover{background:var(--soft);font-weight:600}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0;color:var(--ink);font-weight:400}
.chk input{width:auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.toolbar select{width:auto}
details.fold>summary{display:none}
/* pdp */
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.gal .ph{border-radius:var(--r);aspect-ratio:1/1}
.gal .ph .em{font-size:190px}
.pdp h1{margin:0 0 6px;font-size:26px;line-height:1.2;letter-spacing:-.4px}
.pdp .price{display:flex;gap:12px;align-items:baseline;margin:12px 0}
.pdp .price b{font-size:34px;color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px;font-weight:500}
.chip.on{border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:700}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:34px;height:34px;border:0;background:var(--soft);font-size:18px}
.qty span{min-width:36px;text-align:center;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 16px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;width:34%}
.tablewrap{overflow-x:auto}
.tablewrap table th{width:auto}
/* drawer */
.ovl{position:fixed;inset:0;background:rgba(10,10,30,.55);z-index:90;display:none}
.ovl.on{display:block}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(440px,100%);background:var(--card);z-index:100;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:19px}
.db{flex:1;overflow:auto;padding:12px 16px}
.df{padding:14px 16px;border-top:1px solid var(--line)}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .ph{aspect-ratio:1/1;border-radius:10px}
.line .ph .em{font-size:32px}
.line .nm{min-height:0}
.x{background:none;border:0;color:var(--mute);font-size:20px;padding:4px 8px}
.sumrow{display:flex;justify-content:space-between;padding:4px 0}
.sumrow.t{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.cpn{display:flex;gap:8px;margin:10px 0}
.msg{font-size:13px;margin:4px 0}
.ok{color:var(--ok)}.bad{color:var(--sale)}
/* checkout */
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.box{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.box h2{margin:0 0 12px;font-size:18px}
.pay{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pay label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);font-size:14px;cursor:pointer;margin:0}
.pay input{width:auto}
.pay label:has(input:checked){border-color:var(--brand);background:var(--soft)}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mute)}
.tl{list-style:none;margin:16px 0;padding:0}
.tl li{position:relative;padding:0 0 18px 32px;color:var(--mute)}
.tl li::before{content:"";position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;background:var(--line)}
.tl li::after{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done{color:var(--ink);font-weight:600}
.tl li.done::before{background:var(--ok)}
.tl li.done::after{background:var(--ok)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft)}
.pill.g{background:#d7f3e7;color:#075a3c}
/* footer */
footer{background:var(--head);color:#dfe2ff;margin-top:30px;padding:30px 0 20px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:24px}
footer h4{color:#fff;margin:0 0 10px}
footer a{display:block;padding:3px 0;color:#c9cdf6}
footer a:hover{color:#fff}
footer .pm{display:flex;gap:8px;flex-wrap:wrap}
footer .pm span{background:#fff;color:#151829;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700}
footer small{display:block;margin-top:22px;color:#a9aee0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#151829;color:#fff;padding:10px 18px;border-radius:24px;opacity:0;pointer-events:none;transition:.25s;z-index:120;font-size:14px;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.bnav{display:none}
.empty{text-align:center;padding:44px 12px;color:var(--mute)}
.empty .e{font-size:56px}
.prose{max-width:74ch}
.prose h1{margin-top:0}
.prose p,.prose li{color:var(--mute)}
.tabs2{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
@media (max-width:980px){
  .hero{grid-template-columns:1fr}.promos{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .cats{grid-template-columns:repeat(4,1fr)}.trust{grid-template-columns:repeat(2,1fr)}
  .shop{grid-template-columns:1fr}.side{position:static}
  details.fold>summary{display:block;background:var(--card);padding:12px 14px;border-radius:var(--r);font-weight:600;margin-bottom:10px;cursor:pointer}
  .pdp,.two{grid-template-columns:1fr}
  footer .cols{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  .top .l{display:none}
  header.main .bar{flex-wrap:wrap;gap:8px}
  .searchbox{order:3;flex:1 1 100%;max-width:none}
  .ib span.lb{display:none}
  .logo{font-size:22px}
  .slide{padding:22px 22px}.slide .big{font-size:120px;right:8px}
  .slides{min-height:250px}.sn{display:none}
  .cats{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .ph .em{font-size:60px}
  .pay{grid-template-columns:1fr}
  .row{flex-direction:column;gap:0}
  .pdp h1{font-size:21px}.gal .ph .em{font-size:130px}
  footer .cols{grid-template-columns:1fr}
  body{padding-bottom:64px}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);z-index:60}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0;font-size:11px;background:none;border:0;color:var(--mute);position:relative}
  .bnav .ico{font-size:20px}
  .bnav .cnt{position:absolute;top:2px;left:54%;background:var(--sale);color:#fff;border-radius:9px;min-width:17px;font-size:10px;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="main" class="wrap"></main>
<div id="ftr"></div>
<div class="ovl" id="ovl" data-act="close-cart"></div>
<aside class="drawer" id="drawer" aria-label="Cart"></aside>
<nav class="bnav" id="bnav"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => '৳' + Math.round(n).toLocaleString('en-US');
const store = {
  get(k, d){ try{ const v = localStorage.getItem('kk_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('kk_'+k, JSON.stringify(v)); }catch(e){} }
};
const BRAND = 'Kenakata';
const ADMIN_PIN = 'admin123';       // demo only — change before use, and use real server auth in production
const FREE_SHIP_MIN = 1999;

/* ---------- i18n ---------- */
const I18N = {
 en:{home:'Home',categories:'Categories',cart:'Cart',account:'Account',wishlist:'Wishlist',searchPh:'Search products or categories',search:'Search',sell:'Sell on '+BRAND,help:'Help & support',track:'Track order',
  flash:'Flash sale',endsIn:'Ends in',viewAll:'View all',shopCat:'Shop by category',deals:'Deals you can’t miss',topSellers:'Best sellers',loadMore:'Load more',
  addToCart:'Add to cart',buyNow:'Buy now',outOfStock:'Out of stock',inStock:'In stock',sold:'sold',onlyLeft:'Only {n} left',subtotal:'Subtotal',delivery:'Delivery',free:'Free',discount:'Discount',total:'Total',
  checkout:'Checkout',placeOrder:'Place order',coupon:'Coupon code',apply:'Apply',emptyCart:'Your cart is empty',startShopping:'Start shopping',fullName:'Full name',phone:'Mobile number',email:'Email (optional)',
  address:'Full address',district:'District',note:'Order note (optional)',payment:'Payment method',cod:'Cash on delivery',bkash:'bKash',nagad:'Nagad',card:'Credit / debit card',

/* ---------- cart logic ---------- */
const lines = () => S.cart.map(c => ({...c, p: prod(c.id)})).filter(l => l.p);
const keyOf = (id, v) => id + '|' + (v || '');
function calc(district){
  const ls = lines(); const sub = ls.reduce((a,l) => a + l.p.p * l.q, 0);
  let disc = 0, freeShip = sub >= FREE_SHIP_MIN, msg = '';
  const c = S.coupon && COUPONS[S.coupon];
  if(c){
    if(sub >= (c.min || 0)){ if(c.pct) disc = Math.min(sub * c.pct / 100, c.max || 1e9); if(c.flat) disc = c.flat; if(c.ship) freeShip = true; }
    else msg = 'min';
  }
  const fee = !ls.length ? 0 : (freeShip ? 0 : (district && district !== 'Dhaka' ? 120 : 60));
  return { ls, sub, disc: Math.round(disc), fee, total: Math.max(0, sub - Math.round(disc) + fee), free: freeShip, cmsg: msg, count: ls.reduce((a,l)=>a+l.q,0) };
}
function addToCart(id, v, q){
  const k = keyOf(id, v); const it = S.cart.find(c => keyOf(c.id, c.v) === k); const p = prod(id);
  if(!p || !p.st) return;
  if(it) it.q = Math.min(p.st, it.q + q); else S.cart.push({id:Number(id), v:v||'', q:Math.min(p.st, q)});
  persist('cart'); refresh(); toast(t('added'));
}

function route(){ const h = location.hash.slice(1) || '/'; const i = h.indexOf('?'); const path = i < 0 ? h : h.slice(0,i); return { parts: path.split('/').filter(Boolean), q: new URLSearchParams(i < 0 ? '' : h.slice(i+1)) }; }
let tickTimer, slideTimer;
function go(){ S.shown = 12; S.pdp = {v:{},q:1}; S.tab = 'desc'; render(); window.scrollTo(0,0); markNav(); }
function render(){
  const r = route(), p = r.parts; let html;
  clearInterval(slideTimer);
  if(!p.length) html = pageHome();
  else if(p[0]==='shop') html = pageShop(r);
  else if(p[0]==='product') html = pageProduct(p[1]);
  else if(p[0]==='checkout') html = pageCheckout();
  else if(p[0]==='order') html = pageOrder(p[1]);
  else if(p[0]==='account') html = pageAccount(p[1]);
  else if(p[0]==='track') html = pageTrack(r);
  else if(p[0]==='admin') html = pageAdmin();
  else if(p[0]==='policy') html = pagePolicy(p[1]);
  else html = pageHome();
  $('#main').innerHTML = html;
  document.title = BRAND + ' — Online Shopping in Bangladesh';
  if(!p.length) startSlides();
  tick();
}

function startSlides(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  slideTimer = setInterval(() => setSlide(S.slide + 1), 5500);

function setSlide(i){
  const n = slidesData().length; S.slide = (i + n) % n;
  $$('.slide').forEach((el,k) => el.classList.toggle('on', k === S.slide));
  $$('.dots button').forEach((el,k) => el.classList.toggle('on', k === S.slide));
}
function filterList(q){
  let l = products(); const cat = q.get('cat'), s = (q.get('q')||'').trim().toLowerCase();
  if(cat) l = l.filter(p => p.cat === cat);
  if(s) l = l.filter(p => (p.n + ' ' + catOf(p.cat)[1] + ' ' + catOf(p.cat)[2]).toLowerCase().includes(s));
  if(q.get('sale')) l = l.filter(p => off(p) > 0);
  if(q.get('stock')) l = l.filter(p => p.st > 0);
  const mn = Number(q.get('min')), mx = Number(q.get('max'));
  if(mn) l = l.filter(p => p.p >= mn); if(mx) l = l.filter(p => p.p <= mx);
  const so = q.get('sort') || 'pop';
  l.sort((a,b) => so==='low' ? a.p-b.p : so==='high' ? b.p-a.p : so==='disc' ? off(b)-off(a) : b.s-a.s);
  return l;
}
function pageShop(r){

  const title = q.get('q') ? '“'+esc(q.get('q'))+'”' : (cat ? esc(catName(catOf(cat))) : t('allCats'));
  return '<div class="crumb"><a href="#/">'+t('home')+'</a> / '+title+'</div><div class="shop"><details class="fold" open><summary>'+t('filters')+'</summary><aside class="side"><h3>'+t('categories')+'</h3><a href="'+link({cat:''})+'" class="'+(!cat?'on':'')+'">'+t('allCats')+'</a>'

   + '<h3> </h3><a href="'+link({sale:q.get('sale')?'':'1'})+'" class="chk"><input type="checkbox" tabindex="-1" '+(q.get('sale')?'checked':'')+' style="pointer-events:none"> '+t('onSale')+'</a><a href="'+link({stock:q.get('stock')?'':'1'})+'" class="chk"><input type="checkbox" tabindex="-1" '+(q.get('stock')?'checked':'')+' style="pointer-events:none"> '+t('inStockOnly')+'</a></aside></details>'
   + '<section><div class="toolbar"><b>'+list.length+' '+t('results')+'</b><label style="margin:0;display:flex;gap:8px;align-items:center">'+t('sortBy')+'<select data-sort aria-label="'+t('sortBy')+'">'

function pageProduct(id){

/* ---------- countdown ---------- */
function tick(){
  const now = new Date(), end = new Date(now); end.setHours(23,59,59,999);
  const d = Math.max(0, end - now), h = Math.floor(d/36e5), m = Math.floor(d%36e5/6e4), s = Math.floor(d%6e4/1e3);
  const html = [h,m,s].map(x => '<i>'+String(x).padStart(2,'0')+'</i>').join(':');
  $$('[data-cd]').forEach(el => { el.innerHTML = html; });
}
setInterval(tick, 1000);

async function sha(s){ try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join(''); }catch(e){ return btoa(unescape(encodeURIComponent(s))); } }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return; const a = b.dataset.act;
  if(a==='add'){ const p = prod(b.dataset.id); if(p.sizes.length || p.colors.length){ location.hash = '#/product/'+p.id; toast(t('chooseOpts')); } else addToCart(p.id,'',1); }
  else if(a==='wish'){ e.preventDefault(); toggleWish(b.dataset.id); }
  else if(a==='cart-open') openCart();
  else if(a==='close-cart') closeCart();
  else if(a==='qty'){ const it = S.cart.find(c => keyOf(c.id,c.v) === b.dataset.k); if(it){ it.q += Number(b.dataset.d); const p = prod(it.id); if(p) it.q = Math.min(it.q, p.st); if(it.q <= 0) S.cart = S.cart.filter(c => c !== it); persist('cart'); refresh(); } }
  else if(a==='rm'){ S.cart = S.cart.filter(c => keyOf(c.id,c.v) !== b.dataset.k); persist('cart'); refresh(); toast(t('removed')); }
  else if(a==='coupon'){ const v = ($('#cpn').value||'').trim().toUpperCase(); S.coupon = v && COUPONS[v] ? v : (v ? 'INVALID' : null); if(S.coupon==='INVALID'){ S.coupon = null; toast(t('cpnBad')); } persist('coupon'); refresh(); }
  else if(a==='coupon-rm'){ S.coupon = null; persist('coupon'); refresh(); }
  else if(a==='lang'){ S.lang = S.lang === 'en' ? 'bn' : 'en'; persist('lang'); document.documentElement.lang = S.lang; mountChrome(); render(); }
  else if(a==='slide'){ setSlide(S.slide + Number(b.dataset.d)); }
  else if(a==='slide-to'){ setSlide(Number(b.dataset.i)); }
  else if(a==='more'){ S.shown += 12; render(); }
  else if(a==='price'){ const u = new URLSearchParams(route().q); const mn = $('#pmin').value, mx = $('#pmax').value; mn ? u.set('min',mn) : u.delete('min'); mx ? u.set('max',mx) : u.delete('max'); location.hash = '#/shop?'+u.toString(); }
  else if(a==='opt'){ S.pdp.v[b.dataset.g] = b.dataset.v; $$('[data-act="opt"][data-g="'+b.dataset.g+'"]').forEach(x => x.classList.toggle('on', x === b)); }
  else if(a==='pq'){ S.pdp.q = Math.max(1, Math.min(99, S.pdp.q + Number(b.dataset.d))); $('#pq').textContent = S.pdp.q; }
  else if(a==='pdp-add' || a==='pdp-buy'){
    const p = prod(b.dataset.id); if((p.sizes.length && !S.pdp.v.size) || (p.colors.length && !S.pdp.v.color)){ toast(t('chooseOpts')); return; }
    const v = [S.pdp.v.size, S.pdp.v.color].filter(Boolean).join(' / '); addToCart(p.id, v, S.pdp.q);
    if(a==='pdp-buy'){ closeCart(); location.hash = '#/checkout'; }
  }
  else if(a==='tab'){ S.tab = b.dataset.t; render(); }
  else if(a==='review'){ const tx = $('#rv-t').value.trim(); if(!tx){ return; } const id = b.dataset.id; (S.reviews[id] = S.reviews[id] || []).unshift({n:S.me?S.me.name:t('guest'), s:Number($('#rv-s').value), t:tx, d:new Date().toLocaleDateString()}); persist('reviews'); render(); }
  else if(a==='auth-tab'){ S.authTab = b.dataset.t; render(); }
  else if(a==='logout'){ S.me = null; persist('me'); mountChrome(); location.hash = '#/'; }
  else if(a==='admin-tab'){ S.adminTab = b.dataset.t; render(); }
  else if(a==='admin-out'){ S.admin = false; try{ sessionStorage.removeItem('kk_admin'); }catch(x){} render(); }
  else if(a==='pdel'){ const id = Number(b.dataset.id); if(S.extra.some(p => p.id === id)) S.extra = S.extra.filter(p => p.id !== id); else S.hidden.push(id); persist('extra','hidden'); render(); }
});
document.addEventListener('change', e => {
  const t2 = e.target;
  if(t2.matches('[data-sort]')){ const u = new URLSearchParams(route().q); u.set('sort', t2.value); location.hash = '#/shop?'+u.toString(); }
  else if(t2.matches('[data-ostatus]')){ const o = S.orders.find(x => x.id === t2.dataset.ostatus); if(o){ o.status = Number(t2.value); persist('orders'); toast(statusName(o.status)); } }
  else if(t2.matches('[data-pstock]')){ const p = prod(t2.dataset.pstock); if(p){ p.st = Math.max(0, Number(t2.value)||0); const ex = S.extra.find(x => x.id === p.id); if(ex) persist('extra'); else { S.stock[p.id] = p.st; persist('stock'); } toast(t('saved')); } }
  else if(t2.id === 'f-district') updateSummary();
  else if(t2.name === 'pay'){ const n = $('#paynote'); if(n) n.style.display = t2.value === 'cod' ? 'none' : 'block'; }
});
document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  if(f.id === 'sform'){ const v = $('#q').value.trim(); $('#sug').style.display = 'none'; location.hash = '#/shop?q=' + encodeURIComponent(v); }
  else if(f.id === 'tform'){ location.hash = '#/track?id='+encodeURIComponent($('#t-id').value)+'&phone='+encodeURIComponent($('#t-ph').value); }
  else if(f.id === 'adform'){ if($('#ad-pin').value === ADMIN_PIN){ S.admin = true; try{ sessionStorage.setItem('kk_admin','1'); }catch(x){} render(); } else $('#aderr').textContent = 'Wrong PIN'; }
  else if(f.id === 'apform'){
    const n = $('#np-n').value.trim(), pr = Number($('#np-p').value), mr = Number($('#np-m').value) || pr;
    if(!n || !pr){ $('#aperr').textContent = t('required'); return; }
    const id = 1000 + S.extra.length + Math.floor(Math.random()*900);
    const list = x => x.split(',').map(s => s.trim()).filter(Boolean);
    S.extra.push({id, cat:$('#np-c').value, n, p:pr, m:Math.max(mr,pr), e:$('#np-e').value || '🛍️', s:0, st:Number($('#np-s').value)||0, sizes:list($('#np-z').value), colors:list($('#np-k').value), d:$('#np-d').value.trim()});
    persist('extra'); toast(t('saved')); render();
  }
  else if(f.id === 'aform'){
    const reg = S.authTab === 'reg', email = $('#a-email').value.trim().toLowerCase(), pw = $('#a-pw').value, err = $('#aerr');
    if(!email || pw.length < 6){ err.textContent = t('required') + ' (6+ chars)'; return; }
    const h = await sha(pw);
    if(reg){
      const name = $('#a-name').value.trim(), phone = $('#a-phone').value.trim();
      if(!name || !validPhone(phone)){ err.textContent = t('invalidPhone'); return; }
      if(S.users.some(u => u.email === email)){ err.textContent = t('exists'); return; }
      const u = {email, name, phone, h}; S.users.push(u); persist('users'); S.me = {email, name, phone}; persist('me');
    } else {
      const u = S.users.find(x => x.email === email && x.h === h); if(!u){ err.textContent = t('wrongLogin'); return; }
      S.me = {email:u.email, name:u.name, phone:u.phone, district:u.district, addr:u.addr}; persist('me');
    }
    mountChrome(); render();
  }
  else if(f.id === 'pform'){
    const m = S.me; m.name = $('#p-name').value.trim() || m.name; m.phone = $('#p-phone').value.trim(); m.district = $('#p-district').value; m.addr = $('#p-addr').value.trim();
    const u = S.users.find(x => x.email === m.email); if(u) Object.assign(u, {name:m.name, phone:m.phone, district:m.district, addr:m.addr});
    persist('me','users'); toast(t('saved')); mountChrome();
  }
  else if(f.id === 'cform'){
    const cust = {name:$('#f-name').value.trim(), phone:$('#f-phone').value.trim(), email:$('#f-email').value.trim(), district:$('#f-district').value, addr:$('#f-addr').value.trim(), note:$('#f-note').value.trim()};
    const err = $('#ferr');
    if(!cust.name || !cust.addr){ err.textContent = t('required'); return; }
    if(!validPhone(cust.phone)){ err.textContent = t('invalidPhone'); return; }
    const c = calc(cust.district); if(!c.ls.length) return;
    const pay = ($('input[name="pay"]:checked')||{}).value || 'cod';
    const id = 'KK' + String(Math.floor(Math.random()*1e8)).padStart(8,'0');
    const o = {id, date:Date.now(), uid:S.me ? S.me.email : '', cust, pay, status:0, coupon:S.coupon, sub:c.sub, disc:c.disc, fee:c.fee, total:c.total, items:c.ls.map(l => ({id:l.id, n:l.p.n, v:l.v, q:l.q, p:l.p.p}))};
    S.orders.unshift(o);
    c.ls.forEach(l => { const p = prod(l.id); if(p){ p.st = Math.max(0, p.st - l.q); if(!S.extra.some(x => x.id === p.id)) S.stock[p.id] = p.st; } });
    S.cart = []; S.coupon = null; persist('orders','cart','coupon','extra','stock');
    refresh(); location.hash = '#/order/' + id;
  }
});
/* search suggestions */
document.addEventListener('input', e => {
  if(e.target.id !== 'q') return;
  const v = e.target.value.trim().toLowerCase(), box = $('#sug');
  if(v.length < 2){ box.style.display = 'none'; return; }
  const ps = products().filter(p => p.n.toLowerCase().includes(v)).slice(0,5);
  const cs = CATS.filter(c => (c[1]+' '+c[2]).toLowerCase().includes(v)).slice(0,2);
  box.innerHTML = cs.map(c => '<a href="#/shop?cat='+c[0]+'">'+c[3]+' <span>'+esc(catName(c))+'</span></a>').join('') + ps.map(p => '<a href="#/product/'+p.id+'">'+p.e+' <span>'+esc(p.n)+'</span> <b style="margin-left:auto;color:var(--brand)">'+fmt(p.p)+'</b></a>').join('');
  box.style.display = (ps.length || cs.length) ? 'block' : 'none';
});
document.addEventListener('click', e => { if(!e.target.closest('.searchbox')){ const s = $('#sug'); if(s) s.style.display = 'none'; } });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeCart(); const s = $('#sug'); if(s) s.style.display = 'none'; } });
window.addEventListener('hashchange', go);

/* ---------- boot ---------- */
document.documentElement.lang = S.lang;
mountChrome(); go();
</script>
</body>
</html>
